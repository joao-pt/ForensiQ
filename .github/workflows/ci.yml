name: CI — Testes Django

# Pipeline de integração contínua do ForensiQ.
# Executa a suite de testes Django em cada push/PR para main.
# PostgreSQL-only: a suite corre contra um serviço PostgreSQL (paridade total
# com produção); sem SQLite. Os triggers de imutabilidade (ISO/IEC 27037) são
# exercitados pela própria suite — já não há job separado só para eles.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django tests + cobertura (PostgreSQL, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forensiq
          POSTGRES_PASSWORD: forensiq
          POSTGRES_DB: forensiq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # SECRET_KEY dummy — exigida pelo settings.py mas não sensível em CI
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      # PostgreSQL-only: test_settings lê DATABASE_URL (sem SQLite). O Django
      # cria/destrói a base de teste test_<NOME> no serviço postgres acima.
      DATABASE_URL: 'postgres://forensiq:forensiq@localhost:5432/forensiq_ci'
      ADMIN_URL_PREFIX: 'admin'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          # `requirements-dev.txt` traz factory-boy (usado por tests_factories.py
          # e importado por toda a suite) e pypdf (usado pela extracção em
          # tests_coverage.py::PDFContentValidationTest). Sem ele, o runner falha
          # com ModuleNotFoundError mesmo que pytest e coverage estejam disponíveis.
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar configurações de deploy (Django check)
        working-directory: src/backend
        run: |
          python manage.py check --settings=forensiq_project.test_settings

      - name: Correr a suite completa com cobertura (PostgreSQL)
        working-directory: src/backend
        run: |
          # A suite inteira corre contra PostgreSQL: os triggers de imutabilidade
          # (migrations 0002/0013/0037) são instalados na criação da base de teste
          # e exercitados de facto — ImmutabilityTriggerTest já NÃO faz skip.
          # `--source` alinhado com pyproject [tool.coverage.run] (core +
          # forensiq_project). `coverage report` lê `fail_under = 80` do pyproject
          # e FALHA o build se a cobertura descer abaixo (T13) — gate único.
          coverage run --source='core,forensiq_project' manage.py test core \
            --settings=forensiq_project.test_settings \
            --verbosity=2
          coverage report --show-missing
          coverage xml -o coverage.xml

      - name: Upload do relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: src/backend/coverage.xml
          retention-days: 14

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Enforça o linter no servidor (T13): um contributor sem o hook
    # pre-commit instalado deixava de poder passar CI com código não-linted.
    # `ruff check` lê as regras de src/backend/pyproject.toml [tool.ruff].
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar ruff (versão fixa, reprodutível)
        run: pip install ruff==0.15.13

      - name: ruff check
        run: ruff check src/backend

  e2e:
    name: E2E browser (Playwright)
    runs-on: ubuntu-latest
    # Suite de browser (src/backend/e2e/): fluxos reais, interação HTMX, CSP,
    # acessibilidade (axe, temas claro+escuro), teclado, viewport móvel e
    # orçamentos de rapidez. Corre com o seu próprio settings (e2e_settings, que
    # herda test_settings → PostgreSQL) e arranca o servidor via live_server.
    # Exclui o marcador `visual` — a baseline de regressão visual é específica do
    # ambiente de render (ver docs/testing/).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forensiq
          POSTGRES_PASSWORD: forensiq
          POSTGRES_DB: forensiq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      # e2e_settings herda test_settings (PostgreSQL); o live_server vê os dados
      # porque o PostgreSQL é um servidor partilhado entre threads.
      DATABASE_URL: 'postgres://forensiq:forensiq@localhost:5432/forensiq_ci'
      ADMIN_URL_PREFIX: 'admin'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Instalar o browser do Playwright (+ deps de SO)
        working-directory: src/backend
        run: python -m playwright install --with-deps chromium

      - name: Correr a suite E2E (sem regressão visual)
        working-directory: src/backend
        run: |
          pytest e2e/ --ds=forensiq_project.e2e_settings -m "not visual"
