name: keep-alive

# Mantém a máquina Fly.io acordada entre as 08:00 e as 00:00 (hora de Lisboa).
# Fora desta janela, a app suspende por inactividade (min_machines_running=0),
# poupando recursos durante a madrugada. O Fly.io não suporta janelas horárias
# no fly.toml, pelo que a janela é imposta por tráfego agendado: cada execução
# faz vários pings ao /api/health/ público, impedindo o auto-stop por inactividade.

on:
  schedule:
    # A cada 5 min, das 06:00 às 23:59 UTC (cobre 08:00-00:00 Lisboa em horário
    # de Verão e de Inverno). A janela exacta é depois imposta pelo gate por
    # hora local de Lisboa, robusto a mudanças de hora (DST).
    - cron: "*/5 6-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gate pela hora local de Lisboa (08:00-00:00)
        id: gate
        run: |
          hour=$(TZ='Europe/Lisbon' date +%H)
          # 10# força base decimal (evita "08"/"09" interpretados como octal).
          if [ "$((10#$hour))" -lt 8 ]; then
            echo "Fora da janela (hora local de Lisboa = ${hour}h). A ignorar."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dentro da janela (hora local de Lisboa = ${hour}h)."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Manter a app acordada (pings ao /api/health/)
        if: steps.gate.outputs.active == 'true'
        run: |
          set -u
          url="https://forensiq.pt/api/health/"
          # 5 pings espaçados ~55s cobrem a janela até à próxima execução (5 min),
          # com folga suficiente para o tempo de inactividade do proxy Fly.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   -A 'forensiq-keep-alive (github-actions)' "$url" || echo "000")
            echo "ping ${i}/5 -> HTTP ${code}"
            if [ "$i" -lt 5 ]; then sleep 55; fi
          done
